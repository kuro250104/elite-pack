# Production « light » : un seul serveur Docker (VPS).
#   caddy (HTTPS automatique) → app (image GHCR, sonde /api/health) → postgres (volume persistant)
# Les secrets sont dans /opt/elite-pack/.env sur le serveur, jamais dans le dépôt ni dans GitHub.
# Le pipeline (.github/workflows/cd.yml) copie ce fichier puis lance deploy.sh avec IMAGE et TAG.
name: elite-pack

services:
  postgres:
    image: postgres:17-alpine
    env_file: .env
    environment:
      POSTGRES_USER: elite_pack
      POSTGRES_DB: elite_pack
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elite_pack -d elite_pack"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  migrate:
    image: ${IMAGE:?IMAGE manquante}-migrate:${TAG:?TAG manquant}
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  app:
    image: ${IMAGE:?IMAGE manquante}:${TAG:?TAG manquant}
    env_file: .env
    environment:
      AUTH_TRUST_HOST: "true"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768M }
        reservations: { memory: 256M }

  caddy:
    image: caddy:2-alpine
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      app: { condition: service_healthy }
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

volumes:
  postgres_data:
  caddy_data:
